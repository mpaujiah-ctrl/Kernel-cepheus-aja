name: Kernel cepheus -DEVS- SukiSU

on:
  workflow_dispatch:

env:
  KERNEL_SOURCE: "https://github.com/mpaujiah-ctrl/android_kernel_xiaomi_sm8150_DEVS"
  KERNEL_BRANCH: "lineage-23.2"
  BASE_DEFCONFIG: "vendor/sm8150-perf_defconfig"
  DEVICE_FRAGMENT1: "vendor/xiaomi/cepheus.config"
  DEVICE_FRAGMENT2: "vendor/xiaomi/sm8150-common.config"
  KERNEL_ARCH: "arm64"
  KPM_ENABLE: "false"

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repo sendiri
        uses: actions/checkout@v4

      - name: Clone kernel source (DEVS)
        run: |
          git clone --depth=1 -b "${{ env.KERNEL_BRANCH }}" "${{ env.KERNEL_SOURCE }}" kernel

      - name: Deteksi KERNEL_VERSION dari Makefile
        working-directory: kernel
        run: |
          KV=$(head -n 3 Makefile | grep -E 'VERSION|PATCHLEVEL' | awk '{print $3}' | paste -sd '.')
          echo "KERNEL_VERSION=$KV" >> "$GITHUB_ENV"
          echo "[+] Terdeteksi kernel version: $KV"

      - name: Bersihin hook lama (clean_hook_2.sh) - biar idempotent kalau di-rerun
        working-directory: kernel
        run: |
          cp ../clean_hook_2.sh ./
          bash clean_hook_2.sh
          echo "=== Sisa referensi CONFIG_KSU / CONFIG_KSU_SUSFS (harus kosong) ==="
          grep -rl "CONFIG_KSU" fs/ kernel/ security/ 2>/dev/null || echo "bersih"

      - name: Integrasi SukiSU-Ultra (dari fork sendiri)
        working-directory: kernel
        run: |
          git clone --depth=1 https://github.com/mpaujiah-ctrl/SukiSU-Ultra.git /tmp/sukisu-fork
          ln -sf /tmp/sukisu-fork/kernel drivers/kernelsu
          grep -q "kernelsu" drivers/Makefile || printf "\nobj-\$(CONFIG_KSU) += kernelsu/\n" >> drivers/Makefile
          grep -q 'source "drivers/kernelsu/Kconfig"' drivers/Kconfig || sed -i '/endmenu/i\source "drivers/kernelsu/Kconfig"' drivers/Kconfig
          echo "=== Verifikasi ==="
          ls -la drivers/kernelsu
          grep -i "kernelsu" drivers/Makefile drivers/Kconfig

      - name: Patch kernel_umount.c missing set handler (bug upstream)
        working-directory: kernel
        run: |
          cp ../kernel_umount_set_missing.patch .
          patch -p1 < kernel_umount_set_missing.patch || true
      
      - name: Patch SukiSU-Ultra Fixed (compat non-static-key, dsb)
        working-directory: kernel
        run: |
          cp ../sukisu_ultra_fixed_2.patch ./
          patch -p1 < sukisu_ultra_fixed_2.patch || true
          echo "[+] SukiSU-Ultra Fixed applied (cek .rej kalau ada di bawah)."

      - name: Patch event.c strncpy compat (upstream naming berubah)
        working-directory: kernel
        run: |
          cp ../sukisu_event_strncpy_compat.patch .
          patch -p1 < sukisu_event_strncpy_compat.patch || true
      
      - name: Patch KPM access_ok compat (kernel lama 3-arg)
        working-directory: kernel
        run: |
          cp ../kpm_access_ok_compat.patch .
          patch -p1 < kpm_access_ok_compat.patch || true
          echo "[+] KPM access_ok compat applied (cek .rej kalau gagal)."
      
      - name: Set config dasar KSU + KALLSYMS
        working-directory: kernel
        run: |
          DEFCONFIG="arch/${{ env.KERNEL_ARCH }}/configs/${{ env.BASE_DEFCONFIG }}"
          grep -q "^CONFIG_KSU=y" "$DEFCONFIG" || echo "CONFIG_KSU=y" >> "$DEFCONFIG"
          grep -q "^CONFIG_KALLSYMS=y" "$DEFCONFIG" || echo "CONFIG_KALLSYMS=y" >> "$DEFCONFIG"
          grep -q "^CONFIG_KALLSYMS_ALL=y" "$DEFCONFIG" || echo "CONFIG_KALLSYMS_ALL=y" >> "$DEFCONFIG"
          grep "CONFIG_K" "$DEFCONFIG"

      - name: Clean reboot.c syntax and fix KSU
        working-directory: kernel
        run: |
          echo "[+] Cleaning reboot.c using Python..."
          python3 -c "
          import re
          with open('kernel/reboot.c', 'r') as f:
              content = f.read()
          
          # Hapus pemanggilan ksu_handle_sys_reboot beserta tanda kurungnya secara bersih
          cleaned = re.sub(r'ksu_handle_sys_reboot\s*\([^)]*\)\s*;?', '', content)
          
          with open('kernel/reboot.c', 'w') as f:
              f.write(cleaned)
          "
          
          echo "[+] Updating drivers/Makefile..."
          sed -i 's/obj-\$(CONFIG_KSU) += kernelsu\//obj-y += kernelsu\//g' drivers/Makefile
      
      - name: KPM - cek set_memory.h, backport kalau belum ada
        if: env.KPM_ENABLE == 'true'
        working-directory: kernel
        run: |
          DEFCONFIG="arch/${{ env.KERNEL_ARCH }}/configs/${{ env.BASE_DEFCONFIG }}"
          if [ -f "include/linux/set_memory.h" ]; then
            echo "[+] set_memory.h sudah ada, skip backport."
          else
            cp ../set_memory_to_49_and_low.patch ./
            patch -p1 < set_memory_to_49_and_low.patch || true
            echo "[+] Backport set_memory.h selesai (cek .rej kalau gagal)."
          fi
          echo "CONFIG_KPM=y" >> "$DEFCONFIG"

      - name: SUSFS - cek udah dipatch belum, apply kalau belum
        working-directory: kernel
        run: |
          if grep -q "CONFIG_KSU_SUSFS" "fs/namespace.c" 2>/dev/null; then
            echo "[-] SUSFS sudah ada di source (branch builtin bawaan), skip apply patch."
          else
            PATCH_FILE="../susfs_patch_to_${{ env.KERNEL_VERSION }}.patch"
            if [ ! -f "$PATCH_FILE" ]; then
              echo "[-] File $PATCH_FILE gak ketemu di root repo!"
              echo "[-] Cek lagi nama file yang lo download, harus persis susfs_patch_to_${{ env.KERNEL_VERSION }}.patch"
              exit 1
            fi
            cp "$PATCH_FILE" ./
            patch -p1 < "$(basename "$PATCH_FILE")" 2>&1 | tee ../susfs_patch_log.txt
            echo "[+] SUSFS patch selesai diproses - cek susfs_patch_log.txt & .rej kalau ada hunk gagal."
          fi

      - name: Set config SUSFS
        working-directory: kernel
        run: |
          DEFCONFIG="arch/${{ env.KERNEL_ARCH }}/configs/${{ env.BASE_DEFCONFIG }}"
          for CFG in \
            CONFIG_KSU_SUSFS \
            CONFIG_KSU_SUSFS_SUS_PATH \
            CONFIG_KSU_SUSFS_SUS_MOUNT \
            CONFIG_KSU_SUSFS_SUS_KSTAT \
            CONFIG_KSU_SUSFS_SPOOF_UNAME \
            CONFIG_KSU_SUSFS_ENABLE_LOG \
            CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
            CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG \
            CONFIG_KSU_SUSFS_OPEN_REDIRECT \
            CONFIG_KSU_SUSFS_SUS_MAP ; do
            grep -q "^${CFG}=y" "$DEFCONFIG" || echo "${CFG}=y" >> "$DEFCONFIG"
          done
          if grep -q "THREAD_INFO_IN_TASK" drivers/kernelsu/Kconfig 2>/dev/null; then
            echo "CONFIG_THREAD_INFO_IN_TASK=y" >> "$DEFCONFIG"
          fi
          echo "=== Isi defconfig terkait KSU/SUSFS ==="
          grep "CONFIG_KSU" "$DEFCONFIG"

      - name: Terapkan fixup hunk SUSFS yang gagal
        working-directory: kernel
        run: |
          cp ../susfs_missing_hunks.patch .
          patch -p1 < susfs_missing_hunks.patch || true
          echo "[+] Fixup hunk selesai diproses (cek .rej kalau masih ada yang gagal)."
      
      - name: Kumpulin semua file .rej (kalau ada yang gagal apply)
        working-directory: kernel
        run: |
          mkdir -p ../rej_collected
          find . -name "*.rej" -exec cp --parents {} ../rej_collected/ \; 2>/dev/null || true
          COUNT=$(find ../rej_collected -name "*.rej" | wc -l)
          echo "[+] Ditemukan $COUNT file .rej"
          if [ "$COUNT" -gt 0 ]; then
            echo "::warning::Ada $COUNT hunk yang gagal di-apply, cek artifact rej-files"
          fi

      - name: Update localversion
        working-directory: kernel
        run: |
          DEFCONFIG="arch/${{ env.KERNEL_ARCH }}/configs/${{ env.BASE_DEFCONFIG }}"
          sed -i 's/CONFIG_LOCALVERSION=".*"/CONFIG_LOCALVERSION="-cepheus-SukiSU"/' "$DEFCONFIG"
          grep "CONFIG_LOCALVERSION" "$DEFCONFIG"
      
      - name: Merge defconfig (base + fragment cepheus + fragment KSU/SUSFS)
        working-directory: kernel
        run: |
          export ARCH=arm64
          mkdir -p out
          scripts/kconfig/merge_config.sh -O out \
            "arch/${{ env.KERNEL_ARCH }}/configs/${{ env.BASE_DEFCONFIG }}" \
            "arch/${{ env.KERNEL_ARCH }}/configs/${{ env.DEVICE_FRAGMENT1 }}" \
            "arch/${{ env.KERNEL_ARCH }}/configs/${{ env.DEVICE_FRAGMENT2 }}"
          echo "=== Cek hasil merge ==="
          grep "CONFIG_KSU\|CONFIG_MACH_XIAOMI_CEPHEUS\|CONFIG_ARM64=y\|CONFIG_NR_CPUS" out/.config
      
      - name: Debug config KSU
        if: always()
        working-directory: kernel
        run: |
          grep -n "kernelsu" drivers/Kconfig || true
          grep -n "depends on\|select\|^config" drivers/kernelsu/Kconfig | head -30 || true
          grep -E "OVERLAY_FS|KPROBES" out/.config || true
      
      - name: Install toolchain
        run: |
          sudo apt update
          sudo apt install -y clang lld llvm bc bison flex libssl-dev libelf-dev build-essential
          sudo apt install -y gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Clone AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3
          echo "=== Ganti anykernel.sh & ak3-core.sh ==="
          cp anykernel.sh AnyKernel3/anykernel.sh
          cp ak3-core.sh AnyKernel3/tools/ak3-core.sh
          cat AnyKernel3/anykernel.sh

      - name: Fix yamltree.c (stub, buat host toolchain baru)
        working-directory: kernel
        run: |
          cat > scripts/dtc/yamltree.c << 'CEOF'
          #include <stdio.h>
          #include <stdlib.h>

          struct dt_info;

          void dt_to_yaml(FILE *outf, struct dt_info *dti) {}
          CEOF
           
      - name: Ganti file logika dtc dengan versi dari 16.0-cepheus (dtc 17.0-cepheus gagal parse plugin/overlay &label{})
        working-directory: kernel
        run: |
          rm -rf /tmp/dtc16
          git clone --depth=1 -b 16.0-cepheus "https://github.com/JoK3rLeE/android_kernel_xiaomi_sm8150" /tmp/dtc16
          for f in checks.c dtc-lexer.l dtc-lexer.lex.c_shipped dtc-parser.tab.c_shipped dtc-parser.y dtc.c dtc.h flattree.c livetree.c srcpos.c srcpos.h util.h; do
            cp "/tmp/dtc16/scripts/dtc/$f" "scripts/dtc/$f"
          done
          rm -rf /tmp/dtc16
      
      - name: Matikan LTO total
        working-directory: kernel
        run: |
            scripts/config --file out/.config \
              -d LTO_CLANG -d CFI_CLANG -d CFI_CLANG_SHADOW \
              --set-val LTO_NONE y
            make O=out ARCH=arm64 olddefconfig
      
      - name: Build kernel
        working-directory: kernel
        run: |
          grep -E "^CONFIG_LTO|CONFIG_MACH_XIAOMI_CEPHEUS|CONFIG_KSU=" out/.config
          export ARCH=arm64
          export LLVM=1
          export CC=clang
          export AR=llvm-ar
          export LD=ld.lld
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export STRIP=llvm-strip
          export CROSS_COMPILE=aarch64-linux-gnu-
         
          make ARCH=arm64 O=out CC=clang AR=llvm-ar LD=ld.lld \
               NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
               -j"$(nproc --all)" Image.gz-dtb

          ls out/arch/arm64/boot/Image.gz-dtb
          ls out/arch/arm64/boot/Image

      - name: Verifikasi SukiSU
        if: always()
        working-directory: kernel
        run: |
          grep -E "^CONFIG_KSU|^CONFIG_KPROBES|^CONFIG_KPM" out/.config || true
          find out/drivers/kernelsu -name '*.o' | head -5
          grep -n "ksu" kernel/reboot.c fs/exec.c fs/open.c fs/stat.c kernel/sys.c drivers/input/input.c || true
      
      - name: Pack AnyKernel3
        run: |
          cp kernel/out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          cp kernel/out/arch/arm64/boot/Image kernel-pure.img
          cd AnyKernel3 && zip -r9 ../cepheus_SukiSU.zip * -x README

      - name: Upload hasil build
        uses: actions/upload-artifact@v4
        with:
          name: cepheus-SukiSU
          path: |
            cepheus_SukiSU.zip
            kernel/out/arch/arm64/boot/Image.gz-dtb
            kernel-pure.img

      - name: Upload .rej files (kalau ada patch yang gagal)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rej-files
          path: |
            rej_collected/
            susfs_patch_log.txt
          if-no-files-found: ignore
